<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Crimson Moon Fog Lab</title>
<!-- labs/fog/: tune the mist on the painted rooms, opened from the game's
     ?debug corner column (FOG LAB). Runs the game's REAL 3D background
     renderer (src/core/bg3d.js) — what you see is what ships — and drives
     every fog knob of backgrounds.json parallax live: amount, wind, the
     puffs' own motion (turbulence, breathing, pulse, flow), their shape,
     their lighting and the distance haze. COPY JSON gives the values back
     as a parallax patch. The base href makes the game's relative asset
     paths (assets/...) resolve from the site root. -->
<base href="../../">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
@font-face { font-family: "DIN Condensed"; src: url("assets/fonts/DINCondensedBold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
:root {
  --bg: #0d0808; --panel: rgba(16, 11, 8, 0.86); --line: #3a2c18; --gold: #c9a227; --parchment: #d8c9a3; --muted: #9a8b6a; --blood: #a01818;
  --display: "DIN Condensed", "Oswald", "Arial Narrow", sans-serif;
  --body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--parchment); font-family: var(--body); font-size: 15px; line-height: 1.4; overflow: hidden; }
/* the game's background stack (styles.css section 2) */
#bg-stack { position: fixed; inset: 0; }
.bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2s ease-in-out; }
#bg3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; }
#bg3d.ready { opacity: 1; }
/* the lab's chrome */
.top { position: fixed; left: 16px; top: 14px; z-index: 5; display: flex; gap: 10px; align-items: center; }
.top .labs-link { font-family: var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); text-decoration: none; text-shadow: 0 2px 6px #000; }
.top .labs-link:hover { text-decoration: underline; }
.top h1 { font-family: var(--display); font-weight: 700; color: var(--gold); font-size: 1.6rem; letter-spacing: 0.1em; text-transform: uppercase; margin: 0; line-height: 1; text-shadow: 0 2px 6px #000; }
.top .scene { font-family: var(--display); letter-spacing: 0.08em; font-size: 1.15rem; color: var(--parchment); text-shadow: 0 2px 6px #000; min-width: 16ch; }
.top .hint { color: var(--muted); font-size: 0.85rem; text-shadow: 0 1px 4px #000; }
button, select { font-family: var(--display); font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--parchment); background: linear-gradient(180deg, #2a2416, #1a160d); border: 1px solid #6b5520; border-radius: 4px; padding: 6px 12px 4px; cursor: pointer; }
button:hover, select:hover { border-color: var(--gold); color: #fff; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--gold); color: #fff4d0; box-shadow: 0 0 10px rgba(232,196,92,0.45); }
button.fire { border-color: var(--blood); }
select { text-transform: none; letter-spacing: 0.04em; max-width: 260px; }
#panel { position: fixed; right: 0; top: 0; bottom: 0; width: min(400px, 92vw); z-index: 6; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); backdrop-filter: blur(6px); padding: 14px 16px 40px; box-sizing: border-box; }
#panel.hidden { display: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0 10px; }
details { border-top: 1px solid var(--line); padding: 8px 0 4px; }
summary { font-family: var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-size: 1.05rem; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
summary::after { content: "+"; color: var(--muted); }
details[open] summary::after { content: "−"; }
summary small { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.1em; margin-left: 8px; }
label.s { display: grid; grid-template-columns: 9.5em 1fr 4.2em; gap: 8px; align-items: center; font-size: 0.9rem; margin: 3px 0; }
label.s span:first-child { color: var(--parchment); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
label.s input[type=range] { width: 100%; accent-color: var(--gold); margin: 0; }
label.s .v { font-family: var(--display); color: var(--gold); text-align: right; font-size: 1rem; letter-spacing: 0.04em; }
.note { color: var(--muted); font-size: 0.85rem; margin: 2px 0 8px; }
textarea { width: 100%; box-sizing: border-box; background: #0a0705; color: var(--parchment); border: 1px solid var(--line); border-radius: 4px; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; padding: 6px; }
.ideas ol { padding-left: 1.2em; margin: 4px 0; }
.ideas li { margin: 4px 0; }
.ideas b { color: var(--parchment); }
.ideas .done { color: var(--muted); }
.ideas .done b { color: var(--gold); }
#status { color: var(--muted); font-size: 0.85rem; min-height: 1.2em; }
</style>
</head>
<body>
<div id="bg-stack"><div class="bg-layer" id="bg0"></div><div class="bg-layer" id="bg1"></div></div>
<div class="top">
  <a class="labs-link" href="labs/" title="all labs">‹ Labs</a>
  <h1>Fog Lab</h1>
  <button id="prev" title="previous painting (←)">‹</button>
  <span class="scene" id="sceneName">…</span>
  <button id="next" title="next painting (→)">›</button>
  <select id="sceneSel" title="painting"></select>
  <button id="hide" title="hide / show the panel (H)">Panel</button>
  <span class="hint">← → paintings · H panel · F flash · J jolt</span>
</div>
<aside id="panel"></aside>
<!-- the versioned boot (labs/boot.js): the game's modules and this lab's script under ?v=<build> -->
<script src="labs/boot.js" data-lab="labs/fog/lab.js"></script>
</body>
</html>
