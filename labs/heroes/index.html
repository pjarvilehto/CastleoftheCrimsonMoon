<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Crimson Moon Hero Lab</title>
<!-- labs/heroes/: the CHOOSE YOUR HERO screen (0.00247 a draft; shipped as
     ui/scenes/heroScene.js in 0.00248) over any painting, drawn from the
     game's own data and stylesheet (heroes.json, styles.css section 6b):
     seven character classes — the Curious Knight and the developer's
     Barbarian, Wizard, Necromancer, Druid, Hexhunter and Plague Sister
     (assets/style/heroes/ are the sheets, assets/heroes/ the cut-outs) —
     in the game's LINE-UP, or the SHOWCASE alternative (the chosen hero
     large beside the lines, the seven as a strip). Click or 1-7 choose, ←/→ turn the look, Space is PROCEED;
     COPY JSON gives the picks back. Nothing here touches the game or the
     save. The base href keeps the game's relative paths. -->
<base href="../../">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="stylesheet" href="styles.css" data-versioned>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root { --line: #3a2c18; --muted: #9a8b6a; --display: "D-DIN Condensed", "Oswald", "Arial Narrow", sans-serif; --body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", sans-serif; }
html, body { overflow: hidden; }
#room { position: fixed; inset: 0; background: #0d0808 center / cover no-repeat; }
#room::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0.15), rgba(0,0,0,0.7)); }

/* ---- the lab's own bar (not part of the screen) ---- */
.top { position: fixed; left: 16px; top: 12px; right: 16px; z-index: 50; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.top h1 { font-family: var(--display); font-weight: 700; color: var(--gold); font-size: 1.4rem; letter-spacing: 0.1em; text-transform: uppercase; margin: 0; line-height: 1; text-shadow: 0 2px 6px #000; }
.top .labs-link { color: var(--gold); font-family: var(--display); letter-spacing: 0.1em; text-decoration: none; text-shadow: 0 2px 6px #000; }
.top .hint { color: var(--muted); font-size: 0.82rem; text-shadow: 0 1px 4px #000; font-family: var(--body); margin-left: auto; }
.top button, .top select { font-family: var(--display); font-size: 0.95rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--parchment); background: linear-gradient(180deg, #2a2416, #1a160d); border: 1px solid #6b5520; border-radius: 4px; padding: 5px 10px 3px; cursor: pointer; min-width: 0; min-height: 0; }
.top button:hover, .top select:hover { border-color: var(--gold); color: #fff; }
.top button.on { background: var(--gold); color: #1a1208; border-color: var(--gold); }
.top select { text-transform: none; letter-spacing: 0.04em; max-width: 15em; }
#status { color: var(--muted); font-size: 0.82rem; font-family: var(--body); text-shadow: 0 1px 4px #000; }

/* ---- the screen: the game's rules (styles.css 6b) on a fixed root, since the lab has no #app ---- */
.hero-screen { position: fixed; padding-top: 56px; } /* (the lab's bar sits over the top) */
.hero .num { pointer-events: none; }

/* ---- SHOWCASE: the chosen hero large beside the lines, the seven as a strip ---- */
body.showcase .hero-screen { display: grid; grid-template-columns: 38vw 1fr; grid-template-rows: auto minmax(0, 1fr) auto; padding: 5vh 4vw 2.5vh; gap: 1vh 2vw; align-items: end; }
body.showcase .hero-head { grid-column: 1 / -1; }
body.showcase .stage { grid-row: 2 / 4; align-self: end; height: 72vh; position: relative; display: flex; align-items: flex-end; justify-content: center; }
body.showcase .stage img { height: calc(72vh * var(--fh) * 1.08); max-width: 40vw; object-fit: contain; object-position: bottom center; filter: drop-shadow(0 1.5vh 2.5vh rgba(0,0,0,0.8)); -webkit-user-drag: none; }
body.showcase .stage .ground { position: absolute; left: 10%; right: 10%; bottom: -1vh; height: 4vh; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0,0,0,0.75), rgba(0,0,0,0)); }
body.showcase .hero-detail { width: auto; align-self: center; margin-top: 0; }
body.showcase .hero-row { --hero-h: 21vh; justify-content: flex-start; align-self: end; margin-top: calc(var(--hero-h) * 0.2); }
body.showcase .hero-row .name small { display: none; }
body.showcase .hero .looks .which { display: none; }
body:not(.showcase) .stage { display: none; }
</style>
</head>
<body>
<div id="room"></div>
<div class="hero-screen">
  <div class="hero-head"><h1>CHOOSE YOUR HERO</h1><div class="subtitle">Who walks into the castle tonight?</div></div>
  <div class="stage"><div class="ground"></div><img alt=""></div>
  <div class="hero-row" id="row"></div>
  <div class="panel hero-detail" id="detail"></div>
</div>
<div class="top">
  <a class="labs-link" href="labs/">‹ Labs</a>
  <h1>Hero Lab</h1>
  <span id="layouts"></span>
  <select id="painting" title="The painting behind the screen"></select>
  <button id="copy">Copy JSON</button>
  <span id="status"></span>
  <span class="hint">1-7 choose · ←→ look · Space proceed · L layout · P painting</span>
</div>
<!-- the versioned boot (labs/boot.js): the game's modules and this lab's script under ?v=<build> -->
<script src="labs/boot.js" data-lab="labs/heroes/lab.js"></script>
</body>
</html>
